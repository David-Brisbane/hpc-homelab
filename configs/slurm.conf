# Slurm configuration for the HPC homelab.
#
# Cluster:
#   head01    - Slurm controller
#   compute01 - Slurm compute node
#   compute02 - Slurm compute node
#
# This file represents the working configuration used by the lab.
# Secrets and authentication keys are intentionally not stored here.
#

ClusterName=hpc-lab
SlurmctldHost=head01
SlurmUser=slurm

AuthType=auth/munge

SlurmctldPort=6817
SlurmdPort=6818

SrunPortRange=60001-60100

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd

SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

ProctrackType=proctrack/linuxproc
TaskPlugin=task/none

NodeName=compute01 CPUs=2 State=UNKNOWN
NodeName=compute02 CPUs=2 State=UNKNOWN

PartitionName=compute Nodes=compute01,compute02 Default=YES MaxTime=INFINITE State=UP

ReturnToService=2
SlurmctldTimeout=120
SlurmdTimeout=300

SelectType=select/cons_tres
SelectTypeParameters=CR_CPU

MpiDefault=none

SlurmctldDebug=info
SlurmdDebug=info
